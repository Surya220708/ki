name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/debug/app-debug.apk release_output/krishimitra.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: krishimitra-apk
          path: release_output/krishimitra.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Krishimitra App v1.0.0"
          body: "Directly installable APK file for Android."
          files: release_output/krishimitra.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
